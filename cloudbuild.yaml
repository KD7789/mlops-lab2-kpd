# Test, build, push, deploy and smoke-test the wine API with one command
# (run from the project folder):
#
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_VERSION=$(git rev-parse --short HEAD)
#
# If any step fails, the steps after it don't run, so a broken build never reaches Cloud Run.

substitutions:
  _REGION: us-east1
  _REPO: wine-api
  _SERVICE: wine-api
  _VERSION: manual # replaced by the git commit on the command line
  _MIN_ACCURACY: "0.90"

# Runs as the dedicated deployer account instead of a default account.
serviceAccount: projects/mlops-lab2-kpd/serviceAccounts/wine-api-deployer@mlops-lab2-kpd.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s

steps:
  - id: test
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --no-cache-dir --quiet -r requirements-dev.txt
        pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=MODEL_VERSION=${_VERSION}
      - --build-arg=MIN_ACCURACY=${_MIN_ACCURACY}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_VERSION}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_VERSION}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_VERSION} \
          --region=${_REGION} \
          --service-account=wine-api-runtime@$PROJECT_ID.iam.gserviceaccount.com \
          --allow-unauthenticated \
          --port=8080 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=2 \
          --quiet
        gcloud run services describe ${_SERVICE} --region=${_REGION} \
          --format='value(status.url)' > /workspace/service_url.txt

  - id: smoke-test
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - python scripts/smoke_test.py "$$(cat /workspace/service_url.txt)" "${_VERSION}"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_VERSION}
